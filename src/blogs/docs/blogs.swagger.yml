tags:
  - name: Blogs
    description: Blogs CRUD

paths:
  /api/blogs:
    get:
      operationId: getBlogs
      tags: [Blogs]
      summary: Get all blogs
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlogOutput'
    post:
      operationId: createBlog
      tags: [Blogs]
      summary: Create blog
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogInput'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogOutput'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Unauthorized

  /api/blogs/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      operationId: getBlogById
      tags: [Blogs]
      summary: Get blog by id
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogOutput'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    put:
      operationId: updateBlog
      tags: [Blogs]
      summary: Update blog
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogInput'
      responses:
        204:
          description: No content
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      operationId: deleteBlog
      tags: [Blogs]
      summary: Delete blog
      security:
        - basicAuth: []
      responses:
        204:
          description: No content
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  schemas:
    BlogInput:
      type: object
      required: [name, description, websiteUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
        description:
          type: string
          minLength: 1
          maxLength: 500
        websiteUrl:
          type: string
          minLength: 1
          maxLength: 100
          example: https://example.com
    BlogOutput:
      type: object
      required: [id, name, description, websiteUrl, createdAt, isMembership]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '507f1f77bcf86cd799439011'
        name:
          type: string
        description:
          type: string
        websiteUrl:
          type: string
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T12:00:00.000Z'
        isMembership:
          type: boolean
          example: false
