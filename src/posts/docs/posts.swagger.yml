tags:
  - name: Posts
    description: Posts CRUD

paths:
  /api/posts:
    get:
      operationId: getPosts
      tags: [Posts]
      summary: Get all posts
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostOutput'
    post:
      operationId: createPost
      tags: [Posts]
      summary: Create post
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOutput'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Unauthorized

  /api/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      operationId: getPostById
      tags: [Posts]
      summary: Get post by id
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOutput'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    put:
      operationId: updatePost
      tags: [Posts]
      summary: Update post
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        204:
          description: No content
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      operationId: deletePost
      tags: [Posts]
      summary: Delete post
      security:
        - basicAuth: []
      responses:
        204:
          description: No content
        401:
          description: Unauthorized
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  schemas:
    PostInput:
      type: object
      required: [title, shortDescription, content, blogId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 30
        shortDescription:
          type: string
          minLength: 1
          maxLength: 100
        content:
          type: string
          minLength: 1
          maxLength: 1000
        blogId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '507f1f77bcf86cd799439011'
    PostOutput:
      type: object
      required: [id, title, shortDescription, content, blogId, blogName, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '507f1f77bcf86cd799439011'
        title:
          type: string
        shortDescription:
          type: string
        content:
          type: string
        blogId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: '507f1f77bcf86cd799439011'
        blogName:
          type: string
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T12:00:00.000Z'
