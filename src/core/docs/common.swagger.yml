components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: '507f1f77bcf86cd799439011'

  schemas:
    ValidationErrorItem:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationError:
      type: object
      required: [errorsMessages]
      properties:
        errorsMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
