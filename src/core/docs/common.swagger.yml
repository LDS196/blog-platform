components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: '507f1f77bcf86cd799439011'
    PageNumber:
      name: pageNumber
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortDirection:
      name: sortDirection
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  schemas:
    ValidationErrorItem:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ValidationError:
      type: object
      required: [errorsMessages]
      properties:
        errorsMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'

    Pagination:
      type: object
      required: [page, pageSize, pageCount, totalCount]
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        pageCount:
          type: integer
          minimum: 0
          example: 1
        totalCount:
          type: integer
          minimum: 0
          example: 1
